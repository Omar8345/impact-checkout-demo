name: Review PR with IMPACT

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number in this repository
        required: true
        type: number

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_url: ${{ steps.check.outputs.pr_url }}
    steps:
      - name: Check pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "This example workflow only runs tests from branches in this repository." >&2
            exit 1
          fi
          echo "pr_url=https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER" >> "$GITHUB_OUTPUT"

  analyze:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: 6379
      FALKORDB_SSL: "false"
      FALKORDB_GRAPH: impact_ci
      PR_URL: ${{ needs.validate.outputs.pr_url }}
    steps:
      - name: Check out IMPACT
        uses: actions/checkout@v4
        with:
          repository: Omar8345/IMPACT
          ref: 6f472530c7fb8a1abd6292676f577fc5840d7729
          path: impact
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install IMPACT
        run: python -m pip install -r impact/requirements.txt
      - name: Wait for FalkorDB
        run: |
          python - <<'PY'
          import time
          from redis import Redis

          for attempt in range(30):
              try:
                  if Redis(host="127.0.0.1", port=6379, socket_connect_timeout=2).ping():
                      break
              except OSError:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("FalkorDB did not become ready")
          PY
      - name: Review PR and compare tests
        run: |
          mkdir -p review
          python impact/main.py pr "$PR_URL" \
            --company-file company.json \
            --run-tests --compare-base \
            --html review/index.html \
            --report review/impact-report.md
      - name: Save report and graph
        uses: actions/upload-artifact@v4
        with:
          name: impact-review
          path: review/
          if-no-files-found: error

  comment:
    needs: [validate, analyze]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr }}
    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: impact-review
          path: review
      - name: Post or update PR comment
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          marker = "<!-- impact-actions-review -->"
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments"
          report = Path("review/impact-report.md").read_text(encoding="utf-8")
          run_url = (f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/"
                     f"runs/{os.environ['GITHUB_RUN_ID']}")
          body = f"{marker}\n## IMPACT review\n\n{report}\n\n[Full graph and report artifact]({run_url})"

          def api(*args, payload=None):
              result = subprocess.run(
                  ["gh", "api", *args], input=json.dumps(payload) if payload else None,
                  text=True, capture_output=True, check=True,
              )
              return json.loads(result.stdout)

          comments = api(f"{endpoint}?per_page=100")
          previous = next(
              (item for item in comments
               if marker in item.get("body", "")
               and item.get("user", {}).get("login") == "github-actions[bot]"),
              None,
          )
          if previous:
              posted = api(f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/comments/{previous['id']}",
                           "--method", "PATCH", "--input", "-", payload={"body": body})
          else:
              posted = api(endpoint, "--method", "POST", "--input", "-", payload={"body": body})
          print(posted["html_url"])
          PY
